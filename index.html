<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CCNA Launchpad — beginner-friendly CCNA learning with lessons, quizzes and interactive Cisco-style labs." />
  <title>CCNA Launchpad v1.4.1</title>
  <link rel="stylesheet" href="styles.css?v=1.4.1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CL</div>
        <div><strong>CCNA Launchpad</strong><span>v1.4.1</span></div>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-view="dashboard">🏠 <span>Dashboard</span></button>
        <button class="nav-btn" data-view="path">&#129517; <span>Learning path</span></button>
        <button class="nav-btn" data-view="foundations">🧩 <span>Foundations</span></button>
        <button class="nav-btn" data-view="learn">📚 <span>Learn</span></button>
        <button class="nav-btn" data-view="labs">⌨️ <span>Lab</span></button>
        <button class="nav-btn" data-view="practice">🧠 <span>Practice</span></button>
        <button class="nav-btn" data-view="roadmap">🗺️ <span>Roadmap</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="tiny">Progress is saved in this browser.</div>
        <button id="resetProgress" class="text-btn">Reset progress</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>

      <div id="storageNotice" class="warning" role="status" hidden></div>

      <footer class="app-footer" aria-label="Application version">CCNA Launchpad <span id="appVersion">v1.4.1</span></footer>

  <script src="practicals.js?v=1.4.1"></script>
  <script src="advanced-practicals.js?v=1.4.1"></script>
  <script src="learning-lab.js?v=1.4.1"></script>
  <script src="assessment-ui.js?v=1.4.1"></script>
  <script src="progress-store.js?v=1.4.1"></script>
